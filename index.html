<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Digital - MTs Buninagara</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-brand-500 selection:text-white">

    <div id="app" class="min-h-screen flex flex-col md:flex-row pb-16 md:pb-0">
        
        <!-- SIDEBAR FOR DESKTOP -->
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-brand-900 text-white min-h-screen shadow-xl no-print">
            <div class="p-4 flex items-center gap-3 border-b border-brand-800">
                <img id="sidebar-logo" src="https://placehold.co/80x80/047857/ffffff?text=MTs" class="w-10 h-10 rounded-full bg-white p-1 object-cover" alt="Logo MTs">
                <div>
                    <h1 class="font-bold text-sm leading-tight text-white">MTs BUNINAGARA</h1>
                    <p class="text-[11px] text-brand-200">Ujian Berbasis Digital</p>
                </div>
            </div>
            
            <div class="px-4 py-3 bg-brand-800/50 border-b border-brand-800">
                <p class="text-xs text-brand-200">Login Sebagai:</p>
                <p id="user-display-name" class="font-semibold text-sm text-yellow-300 truncate">Administrator</p>
                <span id="user-display-role" class="inline-block mt-1 text-[10px] bg-brand-700 px-2 py-0.5 rounded text-white uppercase">Admin</span>
            </div>

            <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="desktop-menu">
                <!-- Navigation items dynamically inserted by JS -->
            </nav>

            <div class="p-3 border-t border-brand-800">
                <button onclick="handleLogout()" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-red-200 hover:bg-red-600 hover:text-white transition">
                    <i class="fa-solid font-bold fa-right-from-bracket">iostream</i>
                    <span>Keluar / Change Role</span>
                </button>
            </div>
        </aside>

        <!-- TOP BAR FOR MOBILE -->
        <header class="md:hidden bg-brand-900 text-white p-3 flex items-center justify-between sticky top-0 z-40 shadow-md no-print">
            <div class="flex items-center gap-2">
                <img id="mobile-logo" src="https://placehold.co/80x80/047857/ffffff?text=MTs" class="w-8 h-8 rounded-full bg-white p-0.5" alt="Logo">
                <span class="font-bold text-sm tracking-wide">MTs BUNINAGARA</span>
            </div>
            <div class="flex items-center gap-2">
                <span id="mobile-user-role" class="text-[10px] bg-brand-700 px-2 py-1 rounded text-yellow-300 uppercase font-bold">Admin</span>
                <button onclick="handleLogout()" class="text-red-300 hover:text-white text-xs p-1">
                    <i class="fa-solid fa-power-off text-base"></i>
                </button>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 p-4 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full">
            <div id="content-area">
                <!-- Content injected via JavaScript -->
            </div>
        </main>

        <!-- BOTTOM NAVIGATION FOR MOBILE (HP ANDROID FRIENDLY) -->
        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around p-1 z-40 no-print text-center shadow-lg" id="mobile-menu">
            <!-- Mobile Navigation Dynamic -->
        </nav>
    </div>

    <!-- MODAL CONTAINER -->
    <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto p-6 transition-all transform">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <script>
        // ================= SYSTEM INITIAL STATE & STORAGE =================
        const SUBJECTS = [
            "Al-Qur'an Hadis", "Aqidah Akhlak", "Fikih", "Sejarah Kebudayaan Islam (SKI)",
            "Bahasa Indonesia", "Bahasa Arab", "Bahasa Inggris", "Matematika",
            "Ilmu Pengetahuan Alam (IPA)", "Ilmu Pengetahuan Sosial (IPS)",
            "Pendidikan Pancasila (PPKn)", "PJOK", "Seni Budaya", "Prakarya",
            "Mulok: Bahasa Sunda", "Mulok: Ilmu Nahwu"
        ];

        const DEFAULT_SETTINGS = {
            logo: "https://placehold.co/120x120/047857/ffffff?text=MTs+Buninagara",
            schoolName: "MADRASAH TSANAWIYAH BUNINAGARA",
            nsm: "121232070088",
            address: "Jl. Raya Buninagara No. 45, Desa Buninagara, Kec. Kutawaringin",
            principal: "Dadan Hidayat, S.Pd.I",
            nip: "19780512 200501 1 003",
            kopHeader: "KEMENTERIAN AGAMA REPUBLIK INDONESIA\nKANTOR KEMENTERIAN AGAMA KABUPATEN BANDUNG\nMTs BUNINAGARA"
        };

        const DEFAULT_TEACHERS = [
            { id: "G001", name: "Dadan Hidayat, S.Pd.I", nip: "197805122005011003", mapel: "Mulok: Ilmu Nahwu", username: "dadan_nahwu" },
            { id: "G002", name: "Siti Nurhaliza, S.Pd", nip: "198503142010012005", mapel: "Mulok: Bahasa Sunda", username: "siti_sunda" },
            { id: "G003", name: "Ahmad Fauzi, M.Ag", nip: "199001012015031002", mapel: "Al-Qur'an Hadis", username: "ahmad_quran" }
        ];

        const DEFAULT_STUDENTS = [
            { id: "S001", nisn: "0081234567", name: "Asep Ridwan", class: "7A", dob: "12052010" },
            { id: "S002", nisn: "0087654321", name: "Neng Lilis", class: "7A", dob: "25082010" },
            { id: "S003", nisn: "0091122334", name: "Muhammad Zaky", class: "8B", dob: "01012009" }
        ];

        const DEFAULT_EXAMS = [
            {
                id: "EX01",
                title: "Asesmen Sumatif Ilmu Nahwu Semester 1",
                subject: "Mulok: Ilmu Nahwu",
                duration: 60,
                kkm: 75,
                teacherId: "G001",
                proctor: "Siti Nurhaliza, S.Pd",
                date: "2026-10-05",
                time: "08:00 - 09:00",
                token: "NAHWU7",
                active: true,
                questions: [
                    {
                        id: 1, type: "PG",
                        question: "Kalimat dalam bahasa Arab dibagi menjadi 3 bagian, yaitu...",
                        options: ["Isim, Fi'il, Huruf", "Mubtada, Khabar, Fail", "Rafa, Nasab, Jer", "Fi'il Madhi, Mudhari, Amar"],
                        answer: 0
                    },
                    {
                        id: 2, type: "PG",
                        question: "Tanda utama i'rab Rafa pada Isim Mufrad adalah...",
                        options: ["Fathah", "Kasrah", "Dammah", "Sukun"],
                        answer: 2
                    },
                    {
                        id: 3, type: "Essay",
                        question: "Jelaskan pengertian Isim beserta 2 contohnya!",
                        answerKey: "Isim adalah kata benda/kata kerja yang tidak terikat waktu. Contoh: Kitabun, Zaidun."
                    }
                ]
            }
        ];

        // LocalStorage Initialization
        function getStorage(key, defaultData) {
            const data = localStorage.getItem('mts_' + key);
            return data ? JSON.parse(data) : defaultData;
        }

        function setStorage(key, data) {
            localStorage.setItem('mts_' + key, JSON.stringify(data));
        }

        let appData = {
            settings: getStorage('settings', DEFAULT_SETTINGS),
            teachers: getStorage('teachers', DEFAULT_TEACHERS),
            students: getStorage('students', DEFAULT_STUDENTS),
            exams: getStorage('exams', DEFAULT_EXAMS),
            results: getStorage('results', []),
            currentUser: getStorage('currentUser', { role: 'admin', name: 'Administrator MTs', username: 'MTsbuninagara' })
        };

        function saveData() {
            setStorage('settings', appData.settings);
            setStorage('teachers', appData.teachers);
            setStorage('students', appData.students);
            setStorage('exams', appData.exams);
            setStorage('results', appData.results);
            setStorage('currentUser', appData.currentUser);
        }

        // Active Navigation Tab
        let currentTab = 'dashboard';

        function initApp() {
            updateLogos();
            if (!appData.currentUser) {
                renderLoginView();
            } else {
                renderMainApp();
            }
        }

        function updateLogos() {
            const sidebarLogo = document.getElementById('sidebar-logo');
            const mobileLogo = document.getElementById('mobile-logo');
            if (sidebarLogo) sidebarLogo.src = appData.settings.logo;
            if (mobileLogo) mobileLogo.src = appData.settings.logo;
        }

        function renderMainApp() {
            renderHeaderUser();
            renderNavigation();
            switchTab(currentTab);
        }

        function renderHeaderUser() {
            const u = appData.currentUser;
            if (!u) return;
            document.getElementById('user-display-name').innerText = u.name || u.username;
            document.getElementById('user-display-role').innerText = u.role;
            document.getElementById('mobile-user-role').innerText = u.role;
        }

        function handleLogout() {
            appData.currentUser = null;
            saveData();
            renderLoginView();
        }

        function renderLoginView() {
            const content = document.getElementById('content-area');
            const sidebar = document.getElementById('sidebar');
            const mobileMenu = document.getElementById('mobile-menu');
            if (sidebar) sidebar.classList.add('hidden');
            if (mobileMenu) mobileMenu.classList.add('hidden');

            content.innerHTML = `
                <div class="min-h-[85vh] flex items-center justify-center p-2">
                    <div class="bg-white w-full max-w-md p-6 md:p-8 rounded-3xl shadow-xl border border-slate-100">
                        <div class="text-center mb-6">
                            <img src="${appData.settings.logo}" class="w-20 h-20 mx-auto rounded-full p-1 bg-brand-50 border-2 border-brand-500 object-cover mb-3" alt="Logo Sekolah">
                            <h2 class="text-xl font-bold text-slate-800">SISTEM UJIAN DIGITAL</h2>
                            <p class="text-xs font-semibold text-brand-600 uppercase tracking-wider mt-1">${appData.settings.schoolName}</p>
                        </div>

                        <!-- Login Tabs -->
                        <div class="flex bg-slate-100 p-1 rounded-xl mb-6 text-xs font-semibold">
                            <button onclick="setLoginRole('admin')" id="tab-login-admin" class="flex-1 py-2 rounded-lg transition bg-white shadow text-brand-700">Admin</button>
                            <button onclick="setLoginRole('guru')" id="tab-login-guru" class="flex-1 py-2 rounded-lg transition text-slate-500">Guru</button>
                            <button onclick="setLoginRole('siswa')" id="tab-login-siswa" class="flex-1 py-2 rounded-lg transition text-slate-500">Siswa (NISN)</button>
                        </div>

                        <form id="login-form" onsubmit="processLogin(event)" class="space-y-4">
                            <div id="login-fields">
                                <!-- Dynamic fields injected -->
                            </div>
                            <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 rounded-xl font-semibold shadow-lg shadow-brand-500/30 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                <span>Masuk Aplikasi</span>
                            </button>
                        </form>

                        <div class="mt-6 pt-4 border-t text-center text-xs text-slate-400">
                            Default Admin: <span class="font-mono text-slate-600">MTsbuninagara</span> | Pass: <span class="font-mono text-slate-600">Dadan123</span>
                        </div>
                    </div>
                </div>
            `;
            setLoginRole('admin');
        }

        let activeLoginRole = 'admin';
        function setLoginRole(role) {
            activeLoginRole = role;
            ['admin', 'guru', 'siswa'].forEach(r => {
                const btn = document.getElementById(`tab-login-${r}`);
                if (btn) {
                    if (r === role) {
                        btn.className = "flex-1 py-2 rounded-lg transition bg-white shadow text-brand-700 font-bold";
                    } else {
                        btn.className = "flex-1 py-2 rounded-lg transition text-slate-500 font-medium";
                    }
                }
            });

            const fields = document.getElementById('login-fields');
            if (role === 'admin') {
                fields.innerHTML = `
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Username Admin</label>
                        <input type="text" id="username" required placeholder="MTsbuninagara" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Password</label>
                        <input type="password" id="password" required placeholder="Dadan123" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>
                `;
            } else if (role === 'guru') {
                fields.innerHTML = `
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Username Guru</label>
                        <input type="text" id="username" required placeholder="Masukkan Username Guru" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Password (NIP / Standard)</label>
                        <input type="password" id="password" required placeholder="Masukkan Password" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>
                `;
            } else {
                fields.innerHTML = `
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">NISN Siswa</label>
                        <input type="text" id="username" required placeholder="Contoh: 0081234567" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Sandi (Tanggal Lahir: DDMMYYYY)</label>
                        <input type="password" id="password" required placeholder="Contoh: 12052010" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:outline-none text-sm">
                    </div>
                `;
            }
        }

        function processLogin(e) {
            e.preventDefault();
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();

            if (activeLoginRole === 'admin') {
                if (userVal === 'MTsbuninagara' && passVal === 'Dadan123') {
                    appData.currentUser = { role: 'admin', name: 'Administrator MTs', username: 'MTsbuninagara' };
                } else {
                    alert("Gagal Login: Username/Password Admin Salah! (Sesuai Petunjuk: MTsbuninagara / Dadan123)");
                    return;
                }
            } else if (activeLoginRole === 'guru') {
                const found = appData.teachers.find(g => g.username === userVal);
                if (found) {
                    appData.currentUser = { role: 'guru', name: found.name, username: found.username, mapel: found.mapel, id: found.id };
                } else {
                    alert("Akun Guru Tidak Ditemukan! Silahkan hubungi Admin untuk Generate Akun.");
                    return;
                }
            } else if (activeLoginRole === 'siswa') {
                const student = appData.students.find(s => s.nisn === userVal && s.dob === passVal);
                if (student) {
                    appData.currentUser = { role: 'siswa', name: student.name, nisn: student.nisn, class: student.class, id: student.id };
                } else {
                    alert("NISN atau Tanggal Lahir (Sandi) Salah! Silahkan periksa kembali.");
                    return;
                }
            }

            saveData();
            document.getElementById('sidebar').classList.remove('hidden');
            document.getElementById('mobile-menu').classList.remove('hidden');
            currentTab = 'dashboard';
            renderMainApp();
        }

        function renderNavigation() {
            if (!appData.currentUser) return;
            const role = appData.currentUser.role;
            const desktopNav = document.getElementById('desktop-menu');
            const mobileNav = document.getElementById('mobile-menu');

            let navItems = [];

            if (role === 'admin') {
                navItems = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
                    { id: 'guru', label: 'Data Guru', icon: 'fa-chalkboard-user' },
                    { id: 'gen-guru', label: 'Generate Akun', icon: 'fa-key' },
                    { id: 'siswa', label: 'Data Siswa', icon: 'fa-user-graduate' },
                    { id: 'ujian', label: 'Ruang Ujian', icon: 'fa-file-signature' },
                    { id: 'info', label: 'Info & Jadwal', icon: 'fa-calendar-days' },
                    { id: 'rekap', label: 'Rekap Nilai', icon: 'fa-chart-simple' },
                    { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-gear' }
                ];
            } else if (role === 'guru') {
                navItems = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
                    { id: 'ujian', label: 'Buat Soal/Ujian', icon: 'fa-file-pen' },
                    { id: 'info', label: 'Jadwal Ujian', icon: 'fa-calendar-days' },
                    { id: 'rekap', label: 'Rekap Nilai', icon: 'fa-chart-simple' }
                ];
            } else if (role === 'siswa') {
                navItems = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-house' },
                    { id: 'siswa-ujian', label: 'Ruang Ujian Saya', icon: 'fa-pen-to-square' },
                    { id: 'siswa-nilai', label: 'Hasil Nilai', icon: 'fa-award' }
                ];
            }

            // Desktop Render
            desktopNav.innerHTML = navItems.map(item => `
                <button onclick="switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${currentTab === item.id ? 'bg-brand-600 text-white font-semibold shadow-md' : 'text-brand-100 hover:bg-brand-800'}">
                    <i class="fa-solid ${item.icon} w-5 text-center"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');

            // Mobile Render (Top 4-5 items)
            mobileNav.innerHTML = navItems.slice(0, 5).map(item => `
                <button onclick="switchTab('${item.id}')" class="flex-1 py-2 flex flex-col items-center gap-1 ${currentTab === item.id ? 'text-brand-600 font-bold' : 'text-slate-500'}">
                    <i class="fa-solid ${item.icon} text-lg"></i>
                    <span class="text-[10px] leading-none">${item.label}</span>
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            if (!appData.currentUser) {
                renderLoginView();
                return;
            }
            currentTab = tabId;
            renderNavigation();
            const content = document.getElementById('content-area');

            switch(tabId) {
                case 'dashboard': renderDashboard(content); break;
                case 'guru': renderGuruView(content); break;
                case 'gen-guru': renderGenGuruView(content); break;
                case 'siswa': renderSiswaView(content); break;
                case 'ujian': renderRuangUjianView(content); break;
                case 'info': renderInfoUjianView(content); break;
                case 'rekap': renderRekapNilaiView(content); break;
                case 'pengaturan': renderPengaturanView(content); break;
                case 'siswa-ujian': renderSiswaUjianView(content); break;
                case 'siswa-nilai': renderSiswaNilaiView(content); break;
                default: renderDashboard(content);
            }
        }

        function renderDashboard(container) {
            const u = appData.currentUser;
            if (!u) {
                renderLoginView();
                return;
            }
            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Banner Selamat Datang -->
                    <div class="bg-gradient-to-r from-brand-800 to-brand-600 rounded-3xl p-6 text-white shadow-xl flex flex-col md:flex-row items-center justify-between gap-4">
                        <div class="space-y-2 text-center md:text-left">
                            <span class="bg-white/20 text-white text-xs px-3 py-1 rounded-full font-semibold uppercase tracking-wider">Sistem Digital Ujian</span>
                            <h1 class="text-xl md:text-2xl font-extrabold">Selamat Datang di Sistem Ujian Berbasis Digital MTs Buninagara</h1>
                            <p class="text-brand-100 text-sm max-w-xl">Platform ujian online aman, fleksibel, dan transparan untuk meningkatkan mutu pendidikan santri/siswa MTs Buninagara.</p>
                        </div>
                        <img src="${appData.settings.logo}" class="w-24 h-24 rounded-2xl bg-white p-2 object-cover shadow-md hidden sm:block">
                    </div>

                    <!-- Ringkasan Statistik -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-chalkboard-user"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Total Guru</p>
                                <p class="text-xl font-bold text-slate-800">${appData.teachers.length}</p>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-100 text-blue-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-user-graduate"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Total Siswa</p>
                                <p class="text-xl font-bold text-slate-800">${appData.students.length}</p>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-file-signature"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Ujian Aktif</p>
                                <p class="text-xl font-bold text-slate-800">${appData.exams.filter(e => e.active).length}</p>
                            </div>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-amber-100 text-amber-600 flex items-center justify-center text-xl font-bold"><i class="fa-solid fa-book-open"></i></div>
                            <div>
                                <p class="text-xs text-slate-500 font-medium">Mata Pelajaran</p>
                                <p class="text-xl font-bold text-slate-800">${SUBJECTS.length}</p>
                            </div>
                        </div>

            reader.onload = function(evt) {
                const text = evt.target.result;
                const lines = text.split('\n').slice(1);
                let added = 0;
                lines.forEach(line => {
                    const cols = line.split(',');
                    if (cols.length >= 3 && cols[1].trim()) {
                        const name = cols[1].trim();
                        const nip = cols[0].trim();
                        const mapel = cols[2].trim();
                        const username = name.toLowerCase().replace(/[^a-z0-9]/g, '_').substring(0, 12);

                            name: name,
                            mapel: mapel,
                            username: username
                        });
                        added++;
                    }
                });
                saveData();
                alert(`Berhasil mengimpor ${added} Data Guru!`);
                switchTab('guru');
            };
            reader.readAsText(file);
        }

        function saveQuestionForm(e, examId) {
            e.preventDefault();
            const ex = appData.exams.find(x => x.id === examId);
            const type = document.getElementById('q-type').value;
            const qText = document.getElementById('q-text').value;

            if (type === 'PG') {
                const options = [
                    document.getElementById('opt-0').value,
                    document.getElementById('opt-1').value,
                    document.getElementById('opt-2').value,
                    document.getElementById('opt-3').value
                ];
                const correct = parseInt(document.querySelector('input[name="pg-correct"]:checked').value);
                ex.questions.push({ id: Date.now(), type: 'PG', question: qText, options: options, answer: correct });
            } else {
                const essayKey = document.getElementById('q-essay-key').value;
                ex.questions.push({ id: Date.now(), type: 'Essay', question: qText, answerKey: essayKey });
            }

            saveData();
            closeModal();
            manageQuestions(examId);
        }

            const ex = appData.exams.find(x => x.id === examId);

        }

                        <h2 class="text-lg font-bold text-slate-800">Ruang Ujian Saya</h2>
                        <p class="text-xs text-slate-500">Pilih ujian yang sedang berlangsung di bawah ini</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${activeExams.length === 0 ? `
                            <div class="col-span-2 bg-white p-8 text-center rounded-2xl text-slate-400 text-xs">
                                Tidak ada ujian yang sedang aktif saat ini.
                            </div>
                        ` : activeExams.map(e => `
                            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-3">
                                <div>
                                    <span class="bg-brand-50 text-brand-700 text-xs font-bold px-2.5 py-0.5 rounded">${e.subject}</span>
                                    <h3 class="font-bold text-slate-800 text-base mt-1">${e.title}</h3>
                                    <p class="text-xs text-slate-500 mt-1"><i class="fa-regular fa-clock"></i> Durasi: ${e.duration} Menit | KKM: ${e.kkm}</p>
                                </div>
                                <button onclick="openStudentTokenModal('${e.id}')" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-2.5 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-pen-to-square"></i> Masuk & Verifikasi Token
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openStudentTokenModal(examId) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex || ex.questions.length === 0) {
                alert("Ujian ini belum memiliki soal!");
                return;
            }

            const u = appData.currentUser || {};
            const modal = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `
                <div class="space-y-4">
                    <div class="text-center border-b pb-3">
                        <span class="bg-brand-100 text-brand-800 text-xs font-bold px-2.5 py-1 rounded-full uppercase">${ex.subject}</span>
                        <h3 class="text-base font-bold text-slate-800 mt-2">${ex.title}</h3>
                        <p class="text-xs text-slate-500">Konfirmasi Data Peserta & Token Ujian</p>
                    </div>

                    <form onsubmit="verifyExamTokenAndStart(event, '${ex.id}')" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-bold text-slate-700 mb-1">Nama Lengkap Siswa</label>
                            <input type="text" id="token-student-name" value="${u.name || ''}" required class="w-full p-2.5 rounded-xl border border-slate-300 font-semibold">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">NISN / No. Peserta</label>
                                <input type="text" id="token-student-nisn" value="${u.nisn || ''}" required class="w-full p-2.5 rounded-xl border border-slate-300 font-mono">
                            </div>
                            <div>
                                <label class="block font-bold text-slate-700 mb-1">Kelas</label>
                                <input type="text" id="token-student-class" value="${u.class || '7A'}" required class="w-full p-2.5 rounded-xl border border-slate-300">
                            </div>
                        </div>

                        <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 mt-2">
                            <label class="block font-extrabold text-amber-900 mb-1"><i class="fa-solid fa-key"></i> Masukkan Token Ujian</label>
                            <input type="text" id="token-input" required placeholder="Masukkan 5 karakter token dari guru" class="w-full p-2.5 rounded-xl border border-amber-300 font-mono font-bold text-center text-lg uppercase tracking-widest bg-white focus:ring-2 focus:ring-amber-500">
                            <p class="text-[10px] text-amber-700 mt-1">*Minta token ujian kepada guru/pengawas ruang ujian.</p>
                        </div>

                        <div id="token-error-msg" class="hidden text-red-600 font-bold text-center p-2 bg-red-50 rounded-lg text-xs"></div>

                        <div class="flex justify-end gap-2 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-xl font-semibold">Batal</button>
                            <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold shadow flex items-center gap-2">
                                <i class="fa-solid fa-play"></i> Mulai Kerjakan Ujian
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function verifyExamTokenAndStart(e, examId) {
            e.preventDefault();
            const ex = appData.exams.find(x => x.id === examId);
            const inputToken = document.getElementById('token-input').value.trim().toUpperCase();
            const errorElem = document.getElementById('token-error-msg');

            const expectedToken = (ex.token || 'NAHWU7').toUpperCase();

            if (inputToken !== expectedToken) {
                errorElem.classList.remove('hidden');
                errorElem.innerText = "TOKEN UJIAN SALAH! Silahkan tanyakan token yang benar kepada Pengawas / Guru.";
                return;
            }

            const studentDetails = {
                name: document.getElementById('token-student-name').value.trim(),
                nisn: document.getElementById('token-student-nisn').value.trim(),
                class: document.getElementById('token-student-class').value.trim()
            };

            closeModal();
            startStudentTest(examId, studentDetails);
        }

        let activeExamStudentDetails = null;
        let currentStudentAnswers = {};
        let examTimerInterval = null;
        let activeExamRef = null;

        function startStudentTest(examId, studentDetails = null) {
            const ex = appData.exams.find(x => x.id === examId);
            if (!ex || ex.questions.length === 0) {
                alert("Ujian ini belum memiliki soal!");
                return;
            }

            activeExamRef = ex;

            if (studentDetails) {
                activeExamStudentDetails = studentDetails;
            } else {
                activeExamStudentDetails = {
                    name: appData.currentUser ? appData.currentUser.name : 'Siswa',
                    nisn: appData.currentUser ? appData.currentUser.nisn : '',
                    class: appData.currentUser ? appData.currentUser.class : ''
                };
            }

            currentStudentAnswers = {};
            let timeLeftSeconds = ex.duration * 60;

            const container = document.getElementById('content-area');
            container.innerHTML = `
                <div class="space-y-4 max-w-5xl mx-auto pb-12">
                    <!-- Exam Sticky Header Bar -->
                    <div class="bg-brand-900 text-white p-4 rounded-2xl shadow-xl flex flex-wrap items-center justify-between gap-3 sticky top-14 z-30 border border-brand-700">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="bg-brand-700 text-yellow-300 text-[10px] font-bold px-2 py-0.5 rounded uppercase">${ex.subject}</span>
                                <span id="progress-badge" class="bg-white/20 text-white text-[10px] font-semibold px-2 py-0.5 rounded">0 / ${ex.questions.length} Terjawab</span>
                            </div>
                            <h3 class="font-bold text-sm md:text-base leading-tight mt-1 text-white">${ex.title}</h3>
                        </div>
                        
                        <!-- Timer Box -->
                        <div id="timer-box" class="bg-brand-800 px-4 py-2 rounded-xl border border-brand-700 text-center flex items-center gap-3 transition-colors">
                            <i class="fa-solid fa-stopwatch text-yellow-300 text-lg"></i>
                            <div class="text-left">
                                <p class="text-[9px] text-brand-200 uppercase font-bold tracking-wider">Sisa Waktu</p>
                                <p id="timer-display" class="font-mono text-base font-extrabold text-yellow-300 leading-tight">00:00:00</p>
                            </div>
                        </div>
                    </div>

                    <!-- Main Grid: Questions & Navigation Bar -->
                    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 items-start">
                        
                        <!-- QUESTION LIST (Left / Main Column) -->
                        <div class="lg:col-span-3 space-y-4">
                            ${ex.questions.map((q, idx) => `
                                <div id="q-card-${idx}" class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3 scroll-mt-28 transition-all">
                                    <div class="flex items-center justify-between border-b pb-2">
                                        <div class="flex items-center gap-2">
                                            <span class="bg-brand-600 text-white text-xs font-bold px-3 py-1 rounded-lg">Soal No. ${idx + 1}</span>
                                            <span id="status-badge-${idx}" class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded-full">Belum Diisi</span>
                                        </div>
                                        <span class="text-[10px] font-semibold text-slate-400 uppercase bg-slate-50 px-2 py-0.5 rounded border border-slate-200">${q.type}</span>
                                    </div>
                                    <p class="text-sm font-medium text-slate-800 leading-relaxed pt-1">${q.question}</p>

                                    ${q.type === 'PG' ? `
                                        <div class="space-y-2 pt-2">
                                            ${q.options.map((opt, oIdx) => `
                                                <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 hover:bg-brand-50/60 cursor-pointer transition text-xs font-medium bg-slate-50/50">
                                                    <input type="radio" name="ans-${q.id}" value="${oIdx}" onchange="saveAnswer(${q.id}, ${oIdx}, ${idx})" class="text-brand-600 focus:ring-brand-500 w-4 h-4">
                                                    <span><strong class="text-slate-700">${String.fromCharCode(65 + oIdx)}.</strong> ${opt}</span>
                                                </label>
                                            `).join('')}
                                        </div>
                                    ` : `
                                        <div class="pt-2">
                                            <textarea oninput="saveAnswer(${q.id}, this.value, ${idx})" rows="4" class="w-full p-3 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-brand-500 focus:outline-none" placeholder="Ketikkan jawaban essay Anda di sini..."></textarea>
                                        </div>
                                    `}
                                </div>
                            `).join('')}

                            <!-- Submit Button Card -->
                            <div class="p-5 bg-white rounded-2xl border border-slate-200 shadow-sm text-center">
                                <p class="text-xs text-slate-500 mb-3">Pastikan semua nomor soal telah dijawab dengan hijau sebelum menekan tombol selesai.</p>
                                <button onclick="submitExamAnswers('${ex.id}')" class="w-full md:w-auto px-8 bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold shadow-lg shadow-emerald-600/20 transition flex items-center justify-center gap-2 mx-auto">
                                    <i class="fa-solid fa-paper-plane"></i> Selesai & Kirim Jawaban Ujian
                                </button>
                            </div>
                        </div>

                        <!-- QUESTION NAVIGATION BAR / PALETTE (Right / Sticky Panel) -->
                        <div class="lg:col-span-1 lg:sticky lg:top-36 space-y-4">
                            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                <div class="flex items-center justify-between border-b pb-2">
                                    <h4 class="font-bold text-xs text-slate-800 flex items-center gap-1.5">
                                        <i class="fa-solid fa-grip text-brand-600"></i> Navigasi Soal
                                    </h4>
                                    <span id="nav-summary" class="text-[10px] text-slate-500 font-semibold">0/${ex.questions.length}</span>
                                </div>

                                <!-- Legend -->
                                <div class="flex items-center justify-around text-[10px] bg-slate-50 p-2 rounded-xl border border-slate-100">
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-3 h-3 rounded bg-emerald-600 inline-block"></span>
                                        <span class="text-slate-600">Sudah</span>
                                    </div>
                                    <div class="flex items-center gap-1.5">
                                        <span class="w-3 h-3 rounded bg-slate-200 border border-slate-300 inline-block"></span>
                                        <span class="text-slate-600">Belum</span>
                                    </div>
                                </div>

                                <!-- Number Grid -->
                                <div class="grid grid-cols-5 gap-2 pt-1 max-h-64 overflow-y-auto p-1" id="question-nav-grid">
                                    ${ex.questions.map((q, idx) => `
                                        <button id="nav-btn-${idx}" onclick="scrollToQuestion(${idx})" class="h-9 rounded-xl text-xs font-bold border transition-all flex items-center justify-center bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200">
                                            ${idx + 1}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;

            updateQuestionNav();

            if (examTimerInterval) clearInterval(examTimerInterval);
            examTimerInterval = setInterval(() => {
                timeLeftSeconds--;
                
                const hrs = Math.floor(timeLeftSeconds / 3600);
                const mins = Math.floor((timeLeftSeconds % 3600) / 60);
                const secs = timeLeftSeconds % 60;
                
                const timerElem = document.getElementById('timer-display');
                const timerBox = document.getElementById('timer-box');

                if (timerElem) {
                    const formatted = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    timerElem.innerText = formatted;
                }

                // Alert style when time < 5 mins (300 secs)
                if (timeLeftSeconds <= 300 && timerBox) {
                    timerBox.className = "bg-red-600 px-4 py-2 rounded-xl border border-red-500 text-center flex items-center gap-3 animate-pulse text-white";
                    if (timerElem) timerElem.className = "font-mono text-base font-extrabold text-white leading-tight";
                }

                if (timeLeftSeconds <= 0) {
                    clearInterval(examTimerInterval);
                    alert("Waktu pengerjaan ujian telah habis! Sistem akan otomatis menyimpan dan mengumpulkan jawaban Anda.");
                    submitExamAnswers(examId);
                }
            }, 1000);
        }

        function saveAnswer(qId, val, qIndex) {
            if (typeof val === 'string') {
                if (val.trim() === '') {
                    delete currentStudentAnswers[qId];
                } else {
                    currentStudentAnswers[qId] = val;
                }
            } else {
                currentStudentAnswers[qId] = val;
            }
            updateQuestionNav();
        }

        function updateQuestionNav() {
            if (!activeExamRef) return;

            let totalQuestions = activeExamRef.questions.length;
            let answeredCount = 0;

            activeExamRef.questions.forEach((q, idx) => {
                const navBtn = document.getElementById(`nav-btn-${idx}`);
                const statusBadge = document.getElementById(`status-badge-${idx}`);
                const isAnswered = currentStudentAnswers[q.id] !== undefined && currentStudentAnswers[q.id] !== '';

                if (isAnswered) {
                    answeredCount++;
                    if (navBtn) {
                        navBtn.className = "h-9 rounded-xl text-xs font-bold border transition-all flex items-center justify-center bg-emerald-600 border-emerald-600 text-white shadow-sm ring-2 ring-emerald-300/50";
                    }
                    if (statusBadge) {
                        statusBadge.className = "bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full";
                        statusBadge.innerText = "Terjawab";
                    }
                } else {
                    if (navBtn) {
                        navBtn.className = "h-9 rounded-xl text-xs font-bold border transition-all flex items-center justify-center bg-slate-100 border-slate-200 text-slate-700 hover:bg-slate-200";
                    }
                    if (statusBadge) {
                        statusBadge.className = "bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded-full";
                        statusBadge.innerText = "Belum Diisi";
                    }
                }
            });

            const progressBadge = document.getElementById('progress-badge');
            const navSummary = document.getElementById('nav-summary');

            if (progressBadge) progressBadge.innerText = `${answeredCount} / ${totalQuestions} Terjawab`;
            if (navSummary) navSummary.innerText = `${answeredCount}/${totalQuestions}`;
        }

        function scrollToQuestion(index) {
            const el = document.getElementById(`q-card-${index}`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function submitExamAnswers(examId) {
            if (examTimerInterval) clearInterval(examTimerInterval);
            const ex = appData.exams.find(x => x.id === examId);

            let totalScore = 0;
            let totalPG = 0;
            let correctPG = 0;

            ex.questions.forEach(q => {
                if (q.type === 'PG') {
                    totalPG++;
                    if (currentStudentAnswers[q.id] !== undefined && parseInt(currentStudentAnswers[q.id]) === q.answer) {
                        correctPG++;
                    }
                }
            });

            totalScore = totalPG > 0 ? Math.round((correctPG / totalPG) * 100) : 100;

            const studentName = activeExamStudentDetails ? activeExamStudentDetails.name : (appData.currentUser ? appData.currentUser.name : 'Siswa');
            const studentNisn = activeExamStudentDetails ? activeExamStudentDetails.nisn : (appData.currentUser ? appData.currentUser.nisn : '');

            // Save result
            appData.results.push({
                id: Date.now(),
                studentName: studentName,
                nisn: studentNisn,
                subject: ex.subject,
                score: totalScore,
                date: new Date().toLocaleDateString('id-ID')
            });
            saveData();

            alert(`Ujian Berhasil Dikirim!\nNama: ${studentName}\nNilai PG Anda: ${totalScore}`);
            switchTab('siswa-nilai');
        }

        function renderSiswaNilaiView(container) {
            if (!appData.currentUser) return;
            const myResults = appData.results.filter(r => r.nisn === appData.currentUser.nisn);

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                        <h2 class="text-lg font-bold text-slate-800">Hasil Nilai Ujian Saya</h2>
                        <p class="text-xs text-slate-500">Daftar nilai ujian yang telah dikerjakan</p>
                    </div>

                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-50 border-b text-slate-500 text-xs uppercase font-semibold">
                                <tr>
                                    <th class="p-3">Tanggal</th>
                                    <th class="p-3">Mata Pelajaran</th>
                                    <th class="p-3 text-center">Nilai Final</th>
                                    <th class="p-3 text-center">Keterangan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${myResults.length === 0 ? `
                                    <tr><td colspan="4" class="p-4 text-center text-slate-400 text-xs">Belum ada nilai ujian tersimpan.</td></tr>
                                ` : myResults.map(r => `
                                    <tr>
                                        <td class="p-3 text-xs text-slate-500">${r.date}</td>
                                        <td class="p-3 font-semibold text-slate-800">${r.subject}</td>
                                        <td class="p-3 text-center font-bold text-base text-brand-700">${r.score}</td>
                                        <td class="p-3 text-center">
                                            <span class="${r.score >= 75 ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-700'} text-xs font-bold px-2.5 py-1 rounded-full">
                                                ${r.score >= 75 ? 'Tuntas' : 'Remedial'}
                                            </span>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        // Initialize App on DOM Ready
        window.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
</html>
